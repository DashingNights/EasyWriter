name: Release

on:
  push:
    tags:
      - "v*"
  # Run by hand (the Actions tab, or gh workflow run release.yml): the Mac job alone, into the release already published for
  # package.json's version, for a version that came out before its Mac build.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release for the tag. With EP_DRAFT electron-builder uploads into the existing draft for the same tag
  # (electron-publish gitHubPublisher getOrCreateRelease), so the Windows and Mac jobs fill the same release; publish shows it.
  # A re-run on a tag whose release is already published stops here: electron-builder would skip every upload without failing.
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$draft" = true ] || { echo "$GITHUB_REF_NAME is already published. Delete that release or tag a new version." >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --notes ""
          fi

  win:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: "true"
      # Portable copies from before EasyWriter-Portable.zip look for EasyWriter-<version>-win.zip in the latest release. Remove
      # this step once none of them is left.
      - name: Portable zip under its old name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp release/EasyWriter-Portable.zip "release/EasyWriter-$v-win.zip"
          gh release upload "$GITHUB_REF_NAME" "release/EasyWriter-$v-win.zip" --clobber

  # Signed and notarized DMG and zip for Apple silicon and Intel. Off until the repository variable MAC_RELEASE is "true", which
  # needs the secrets CSC_LINK and CSC_KEY_PASSWORD (the Developer ID Application certificate as base64 .p12 and its password),
  # APPLE_API_KEY_P8 (the App Store Connect API key's .p8 text), APPLE_API_KEY_ID and APPLE_API_ISSUER.
  mac:
    needs: draft
    # After the draft on a tag; run by hand, on its own (the draft job is skipped then).
    if: ${{ !cancelled() && vars.MAC_RELEASE == 'true' && (needs.draft.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Run by hand, the job adds to a published release and never makes one.
      - name: Published release for this version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version package.json)"
          [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false ] || { echo "$tag has no published release to add the Mac build to." >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Globe key addon (native/globe/globe.mm), for both architectures, against this Node's headers (N-API 8).
      - name: Globe key addon
        run: |
          NODE_INCLUDE="$(dirname "$(dirname "$(command -v node)")")/include/node"
          clang++ -std=c++17 -ObjC++ -fobjc-arc -bundle -undefined dynamic_lookup -arch arm64 -arch x86_64 -mmacosx-version-min=13.0 -DNAPI_VERSION=8 -I"$NODE_INCLUDE" -framework AppKit native/globe/globe.mm -o native/globe/globe.node
      # Whether the app starts on macOS at all; it does not block the release.
      - run: npm run smoke
        continue-on-error: true
      - name: App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      # electron-builder's own keychain (made when CSC_LINK is set) fails on macOS 26.6: it passes the certificate's password to
      # security set-key-partition-list, which wants the keychain's. So the certificate goes into a keychain made here, which
      # electron-builder finds through CSC_KEYCHAIN.
      - name: Signing keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(openssl rand -base64 24)"
          printf '%s' "$CSC_LINK" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -f pkcs12 -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A tag fills its draft. Run by hand, it uploads into the published release, which electron-builder leaves alone from
          # two hours after publishing unless EP_GH_IGNORE_TIME is set.
          EP_DRAFT: ${{ github.event_name == 'push' }}
          EP_GH_IGNORE_TIME: ${{ github.event_name == 'workflow_dispatch' }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # electron-builder only warns when the notarization secrets are missing. These fail the job on an unsigned, unnotarized or
      # unstapled app.
      - name: Check signature and notarization
        run: |
          for app in release/mac/EasyWriter.app release/mac-arm64/EasyWriter.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl -a -vvv -t exec "$app"
          done

  # Shows the draft once Windows succeeded and the Mac did not fail (skipped while MAC_RELEASE is off).
  publish:
    needs: [draft, win, mac]
    if: always() && needs.win.result == 'success' && needs.mac.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release's title, and which file to download above any notes it has (.github/release-download.md, then
      # .github/release-download-mac.md when the Mac job ran).
      - name: Release title and download notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC: ${{ needs.mac.result }}
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          download="$(cat .github/release-download.md)"
          if [ "$MAC" = success ]; then download="$(printf '%s\n\n%s' "$download" "$(cat .github/release-download-mac.md)")"; fi
          if ! grep -q '^## Download' <<<"$body"; then printf '%s\n\n%s\n' "$download" "$body" > notes.md; else printf '%s\n' "$body" > notes.md; fi
          gh release edit "$GITHUB_REF_NAME" --title "EasyWriter ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
