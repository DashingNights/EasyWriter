[package]
name = "ew-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EasyWriter import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[dependencies]
ew-doc = { workspace = true }
ew-geom = { workspace = true, features = ["image"] }
image = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32-unknown-unknown): ODT change dates.
js-sys = "0.3"

[dev-dependencies]
ew-doc = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
